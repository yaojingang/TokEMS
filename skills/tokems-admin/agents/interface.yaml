interface:
  display_name: "TokEMS Admin"
  short_description: "Securely operate an authorized TokEMS administration surface"
  default_prompt: "Use $tokems-admin to connect to the approved TokEMS instance, inspect the exact target, prepare a governed action, obtain required approval, execute it, and verify the result."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "generic"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
    runtime: "node>=24"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
    credentials: "macOS Keychain or Linux Secret Service"
  degradation:
    openai: "Codex desktop needs shell, outbound HTTPS, Node.js 24, and a supported credential store."
    generic: "Stop before connection when the client cannot run scripts, preserve secrets, enforce the approved origin, or open browser approval URLs."
