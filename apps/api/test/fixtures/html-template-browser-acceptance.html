<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>大会 HTML 模板验收</title>
    <meta name="description" content="TokEMS HTML 模板导入和动态变量验收页面" />
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        color: #f7f4ec;
        background: #0c1726;
      }
      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 48px 24px;
      }
      .hero {
        width: min(920px, 100%);
        padding: clamp(32px, 7vw, 84px);
        background: linear-gradient(135deg, #12345b, #16273c 62%, #6f3f22);
        border: 1px solid rgb(255 255 255 / 18%);
        border-radius: 28px;
      }
      .eyebrow {
        color: #f1bc72;
        font-size: 13px;
        letter-spacing: 0.18em;
      }
      h1 {
        max-width: 760px;
        margin: 18px 0;
        font-family: Georgia, serif;
        font-size: clamp(44px, 8vw, 92px);
        font-weight: 500;
        line-height: 0.96;
      }
      .tagline {
        max-width: 620px;
        color: #d6e1ec;
        font-size: clamp(17px, 2.2vw, 24px);
        line-height: 1.6;
      }
      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 12px 28px;
        margin: 34px 0;
        color: #dce7f2;
      }
      a {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        padding: 0 24px;
        color: #12243a;
        background: #f1bc72;
        border-radius: 999px;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero">
        <p class="eyebrow">GEO大会 · 2026 · 第二届</p>
        <h1>第二届中国 GEO &amp; AI 营销大会</h1>
        <p class="tagline">让好的品牌被 AI 正确推荐</p>
        <div class="meta">
          <span>2026 年 11 月 21–22 日</span>
          <span>深圳湾科技生态园</span>
        </div>
        <a href="/register">立即报名</a>
      </section>
    </main>
  </body>
</html>
