packages:
  - apps/*
  - packages/*

overrides:
  '@fastify/static': 10.1.2
  '@esbuild-kit/core-utils>esbuild': 0.25.4
  brace-expansion: 5.0.9
  'fast-uri@>=3.0.0 <4.0.0': 3.1.5
  'fast-uri@>=4.0.0 <5.0.0': 4.1.2
  find-my-way: 9.7.0
  js-yaml: 5.2.2
  ini: 1.3.8
  tar: 7.5.21

allowBuilds:
  '@alicloud/openapi-core': true
  '@nestjs/core': true
  '@parcel/watcher': true
  '@scarf/scarf': false
  esbuild: true
  msgpackr-extract: true
  sharp: true

minimumReleaseAgeExclude:
  - '@nestjs/swagger@11.4.6'
  - bullmq@5.80.6

peerDependencyRules:
  allowedVersions:
    '@fastify/static': '10'
