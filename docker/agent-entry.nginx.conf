# Include inside both PUBLIC_ORIGIN and ADMIN_ORIGIN server blocks.
# Exact and ^~ locations take precedence over panel-managed /.well-known/ and / prefixes.

location = /.well-known/tokems-agent {
  access_log off;
  proxy_pass http://127.0.0.1:8088;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location = /.well-known/oauth-authorization-server {
  access_log off;
  proxy_pass http://127.0.0.1:8088;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location = /api/v1/template-previews {
  access_log off;
  error_log /dev/null crit;
  proxy_hide_header Referrer-Policy;
  add_header Referrer-Policy "no-referrer" always;
  proxy_pass http://127.0.0.1:8088;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Referer "";
}

location ^~ /api/v1/template-previews/ {
  access_log off;
  error_log /dev/null crit;
