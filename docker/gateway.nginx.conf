map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

map $http_x_forwarded_proto $forwarded_proto {
  default $scheme;
  http http;
  https https;
}

resolver 127.0.0.11 valid=10s ipv6=off;

upstream api_backend {
  zone api_backend 64k;
  server api:4100 resolve;
}

upstream web_backend {
  zone web_backend 64k;
  server web:3000 resolve;
}

upstream payment_web_backend {
  zone payment_web_backend 64k;
  server payment-web:3000 resolve;
}

upstream admin_backend {
  zone admin_backend 64k;
  server admin:8080 resolve;
}

server {
  listen 8080;
  listen [::]:8080;
  server_name ~^admin\..+$;
  server_tokens off;
  absolute_redirect off;
  root /usr/share/nginx/html;

  client_max_body_size 2m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /version.json {
    access_log off;
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location = /web-version.json {
    proxy_pass http://web_backend/version.json;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
  }

  location = /.well-known/tokems-agent {
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  location = /.well-known/oauth-authorization-server {
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  location = / {
    return 308 /admin/;
  }

  location = /admin {
    return 308 /admin/;
  }

  location /admin/ {
    proxy_pass http://admin_backend/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  location ^~ /invoice/file/ {
    proxy_hide_header Referrer-Policy;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    access_log off;
    error_log /dev/null crit;
    rewrite ^/invoice/file/(.*)$ /api/v1/invoice-files/$1 break;
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Referer "";
    proxy_buffering off;
  }
  location ^~ /api/v1/invoice-files/ {
    proxy_hide_header Referrer-Policy;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    access_log off;
    error_log /dev/null crit;
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Referer "";
    proxy_buffering off;
  }

  location /api/ {
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  location / {
    return 404;
  }
}

server {
  listen 8080 default_server;
  listen [::]:8080 default_server;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;

  client_max_body_size 2m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /version.json {
    access_log off;
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location = /web-version.json {
    proxy_pass http://web_backend/version.json;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
  }

  location = /.well-known/tokems-agent {
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  location = /.well-known/oauth-authorization-server {
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  location ^~ /admin {
    return 404;
  }

  location = /pay/hui {
    return 308 /pay/hui/;
  }

  location ^~ /pay/hui/api/v1/invoice-files/ {
    access_log off;
    error_log /dev/null crit;
    add_header Referrer-Policy "no-referrer" always;
    return 404;
  }

  location ^~ /pay/hui/api/ {
    rewrite ^/pay/hui/api/(.*)$ /api/$1 break;
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Referer $http_referer;
  }

  location ^~ /pay/hui/ {
    proxy_pass http://payment_web_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Referer $http_referer;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  location ^~ /invoice/file/ {
    proxy_hide_header Referrer-Policy;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    access_log off;
    error_log /dev/null crit;
    rewrite ^/invoice/file/(.*)$ /api/v1/invoice-files/$1 break;
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Referer "";
    proxy_buffering off;
  }
  location ^~ /api/v1/invoice-files/ {
    proxy_hide_header Referrer-Policy;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    access_log off;
    error_log /dev/null crit;
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Referer "";
    proxy_buffering off;
  }

  location /api/ {
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Referer $http_referer;
  }

  location / {
    proxy_pass http://web_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
