name: tokems-ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  release-descriptor-python36:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify the production Python 3.6 descriptor interface
        run: |
          image='python:3.6.15-alpine3.15@sha256:579978dec4602646fe1262f02b96371779bfb0294e92c91392707fa999c0c989'
          runtime_args=(
            --rm
            --user "$(id -u):$(id -g)"
            --network none
            --read-only
            --security-opt no-new-privileges:true
            --cap-drop ALL
            --pids-limit 64
            --memory 128m
            --cpus 1
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
            --volume "$GITHUB_WORKSPACE:/workspace:ro"
            --workdir /workspace
          )
          docker run "${runtime_args[@]}" "$image" \
            python tooling/release-descriptor.py --help >/dev/null

          docker run "${runtime_args[@]}" -e PYTHONDONTWRITEBYTECODE=1 "$image" \
            python -m unittest discover -s tooling/bluegreen -p 'test_*.py'

          evidence_dir="$(mktemp -d "$RUNNER_TEMP/python36-descriptor.XXXXXX")"
          : >"$evidence_dir/invalid-source.bundle"
          set +e
          docker run "${runtime_args[@]}" \
            --volume "$evidence_dir:/evidence" \
            "$image" \
            sh -c 'PATH=/missing /usr/local/bin/python tooling/release-descriptor.py verify-source-bundle \
              --bundle-file /evidence/invalid-source.bundle \
              --target-sha aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
              2>/evidence/python36-verifier.err'
          verifier_status=$?
          set -e
          [[ "$verifier_status" -eq 1 ]]
          grep -Fq 'source bundle Git validation failed' "$evidence_dir/python36-verifier.err"

  quality-and-flows:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: conference
          POSTGRES_USER: conference
          POSTGRES_PASSWORD: conference
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U conference -d conference"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      NODE_ENV: test
      DEPLOYMENT_MODE: local
      DATABASE_URL: postgresql://conference:conference@localhost:5432/conference
      BATCH_TEST_DATABASE_URL: postgresql://conference:conference@localhost:5432/conference
      PARTNER_TEST_DATABASE_URL: postgresql://conference:conference@localhost:5432/conference
      INVOICE_SMS_TEST_DATABASE_URL: postgresql://conference:conference@localhost:5432/conference
      REDIS_URL: redis://localhost:6379
      INVOICE_SMS_TEST_REDIS_URL: redis://localhost:6379
      TOKEMS_BLUEGREEN_TEST_REDIS_URL: redis://localhost:6379
      JWT_SECRET: conference-ci-verification-secret-at-least-32
      CUSTOMER_OTP_PEPPER: conference-ci-otp-pepper-at-least-32-characters
      CUSTOMER_SESSION_SECRET: conference-ci-session-secret-at-least-32-characters
      NOTIFICATION_PAYLOAD_ENCRYPTION_SECRET: conference-ci-notification-secret-at-least-32-characters
      INVOICE_DOWNLOAD_SIGNING_SECRET: conference-ci-invoice-secret-at-least-32-characters
      PAYMENT_WEBHOOK_SECRET: conference-ci-payment-webhook-secret-at-least-32-characters
      ADMIN_EMAIL: admin@tokems.local
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: Conference2026
      PUBLIC_WEB_URL: http://localhost:3000
      ADMIN_WEB_URL: http://localhost:3200
      NUXT_PUBLIC_API_BASE: http://localhost:4100/api/v1
      VITE_API_BASE: http://localhost:4100/api/v1
      API_BASE: http://localhost:4100/api/v1
      API_BASE_URL: http://localhost:4100/api/v1
      WEB_BASE_URL: http://localhost:3000
      ADMIN_BASE_URL: http://localhost:3200/admin
      S3_ENDPOINT: http://localhost:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: conference-ci
      S3_SECRET_KEY: conference-ci-secret
      S3_BUCKET: conference-assets
      S3_REGION: us-east-1
      NOTIFICATION_WEBHOOK_URL: http://localhost:4080/notifications
      NOTIFICATION_WEBHOOK_TOKEN: conference-ci-notification-token
      NOTIFICATION_SINK_TOKEN: conference-ci-notification-token
      CHROMIUM_PATH: /usr/bin/google-chrome
      BUILD_SHA: ${{ github.sha }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Record build metadata
        run: |
          echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "BUILD_MIGRATION=$(find packages/database/drizzle -maxdepth 1 -name '*.sql' -print | sort | tail -1 | xargs basename)" >> "$GITHUB_ENV"
      - name: Start object storage
        id: object_storage
        run: |
          s3_config="$RUNNER_TEMP/tokems-ci-s3.json"
          cat > "$s3_config" <<EOF
          {"identities":[{"name":"ci","credentials":[{"accessKey":"$S3_ACCESS_KEY","secretKey":"$S3_SECRET_KEY"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
          EOF
          chmod 600 "$s3_config"
          docker run --detach --name tokems-ci-seaweedfs --publish 9000:9000 \
            --volume "$s3_config:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:4.30@sha256:20fb6eabf1468d3e53fb7b8bd05d929f8b01ae8ceccc2668b501176b2366940f \
            server -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json -dir=/data
          for attempt in $(seq 1 60); do
            if [[ "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:9000/)" != 000 ]]; then
              break
            fi
            sleep 1
          done
          for attempt in $(seq 1 30); do
            bucket_result="$(printf 's3.bucket.create -name %s\n' "$S3_BUCKET" | docker exec -i tokems-ci-seaweedfs weed shell || true)"
            if grep -Fq "created bucket $S3_BUCKET" <<< "$bucket_result"; then
              break
            fi
            sleep 2
          done
          echo "$bucket_result"
          grep -Fq "created bucket $S3_BUCKET" <<< "$bucket_result"
          AWS_ACCESS_KEY_ID="$S3_ACCESS_KEY" AWS_SECRET_ACCESS_KEY="$S3_SECRET_KEY" AWS_DEFAULT_REGION="$S3_REGION" \
            aws --endpoint-url http://127.0.0.1:9000 s3api head-bucket --bucket "$S3_BUCKET"
      - name: Migrate and seed
        id: migrate_seed
        run: >-
          pnpm db:prepare &&
          pnpm --filter @conference/database migrate &&
          pnpm --filter @conference/database seed
      - name: Bluegreen proxy download integration tests
        run: |
          proxy_tools="$(mktemp -d "$RUNNER_TEMP/bluegreen-proxy.XXXXXX")"
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 120 \
            https://github.com/google/go-containerregistry/releases/download/v0.20.3/go-containerregistry_Linux_x86_64.tar.gz \
            --output "$proxy_tools/crane.tar.gz"
          printf '%s  %s\n' '36c67a932f489b3f2724b64af90b599a8ef2aa7b004872597373c0ad694dc059' "$proxy_tools/crane.tar.gz" | sha256sum --check --strict
          tar -xzf "$proxy_tools/crane.tar.gz" -C "$proxy_tools" crane
          TOKEMS_BLUEGREEN_TEST_CRANE="$proxy_tools/crane" python3 -m unittest discover -s tooling/bluegreen -p test_proxy_integration.py -v
      - name: Bluegreen transactional update tests
        run: |
          docker run -d --name tokems-bluegreen-sql-test --label codex.task=tokems-bluegreen \
            --network none --memory 256m --cpus 1 \
            --tmpfs /var/lib/postgresql/data:rw,size=256m \
            -e POSTGRES_PASSWORD=bluegreen-test -e POSTGRES_USER=conference -e POSTGRES_DB=conference postgres:16-alpine
          trap 'docker rm -f tokems-bluegreen-sql-test' EXIT
          for attempt in $(seq 1 30); do
            if docker exec tokems-bluegreen-sql-test pg_isready -h 127.0.0.1 -U conference -d conference; then break; fi
            sleep 1
          done
          TOKEMS_BLUEGREEN_TEST_CONTAINER=tokems-bluegreen-sql-test python3 -m unittest discover -s tooling/bluegreen -p test_sql_integration.py -v
      - name: Bluegreen Gateway error-log privacy
        run: |
          docker pull nginx:1.31-alpine
          TOKEMS_BLUEGREEN_TEST_GATEWAY_IMAGE=nginx:1.31-alpine python3 -m unittest discover -s tooling/bluegreen -p test_gateway_privacy_integration.py -v
      - name: Quality gate
        id: quality_gate
        run: pnpm check
      - name: Start built services
        id: start_services
        run: |
          node apps/api/dist/main.js > /tmp/tokems-api.log 2>&1 &
          node apps/worker/dist/main.js > /tmp/tokems-worker.log 2>&1 &
          node apps/web/.output/server/index.mjs > /tmp/tokems-web.log 2>&1 &
          node tooling/local-notification-sink.mjs > /tmp/tokems-notification-sink.log 2>&1 &
          pnpm --filter @conference/admin exec vite preview --host 0.0.0.0 --port 3200 > /tmp/tokems-admin.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:4100/api/v1/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/tokems-api.log
          exit 1
      - name: Persistent and operations flows
        id: business_flows
        run: |
          pnpm test:persistent
          pnpm test:operations
          pnpm test:waitlist
          pnpm test:invoice-export
          pnpm test:admin-upgrade
          pnpm test:security-config
          pnpm test:checkin-load
          pnpm test:tooling
          pnpm test:batch-registration
          pnpm test:registration-experience
          pnpm test:payment-resume
          pnpm test:admin-order-close
          PARTNER_ACCOUNT_BASE_URL=http://localhost:3000 pnpm test:partner-account
          pnpm test:partner-dialogs
          node --test tooling/invoice-sms-ui-smoke.mjs
          INVOICE_SMS_GATEWAY_TEST=1 node --test tooling/invoice-sms-gateway-smoke.mjs
          pnpm test:visual
      - name: Dependency audit
        id: dependency_audit
        run: pnpm audit --registry=https://registry.npmjs.org
      - name: Generate release evidence manifest
        if: always()
        run: >-
          pnpm release:manifest --
          --output test-results/remediation/ci/manifest.json
          --test-result object-storage=${{ steps.object_storage.outcome }}
          --test-result migrate-seed=${{ steps.migrate_seed.outcome }}
          --test-result quality-gate=${{ steps.quality_gate.outcome }}
          --test-result start-services=${{ steps.start_services.outcome }}
          --test-result business-flows=${{ steps.business_flows.outcome }}
          --test-result dependency-audit=${{ steps.dependency_audit.outcome }}
      - name: Upload release evidence manifest
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tokems-release-evidence-${{ github.sha }}
          path: test-results/remediation/ci/manifest.json
          if-no-files-found: error
